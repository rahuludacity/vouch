[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch"
version = "0.6.0"
description = "Python SDK for Vouch — governed agent deployment, with proof"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # stdlib only (urllib, hmac, hashlib, json)

[project.urls]
Repository = "https://github.com/rahuludacity/vouch"

[tool.setuptools.packages.find]
where = ["."]
include = ["vouch*"]
